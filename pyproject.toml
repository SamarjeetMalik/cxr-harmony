[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-harmony"
version = "0.1.0"
description = "Multi-site chest radiograph ingestion, de-identification, harmonisation and dataset release pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samarjeet Malik", email = "samarjeetmalik.gs5@gmail.com" }]
keywords = ["dicom", "de-identification", "medical-imaging", "data-governance", "chest-x-ray"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydicom>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "SQLAlchemy>=2.0",
    "typer>=0.9",
    "PyYAML>=6.0",
    "jsonschema>=4.19",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "matplotlib>=3.7",
    # Pipeline versioning and the security audit. Kept out of the runtime
    # dependencies: neither is needed to run the pipeline, and a data backbone
    # should not drag a build toolchain into a production image.
    "dvc>=3.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "detect-secrets>=1.4",
]
# Burned-in redaction audit trail. Optional because it needs a system binary
# (`apt-get install tesseract-ocr`, `winget install tesseract-ocr.tesseract`) and
# because de-identification must not fail for want of an audit record. Without
# it the pipeline behaves exactly as it does with it; only the audit is absent.
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
cxr-harmony = "cxr_harmony.cli:app"

[project.urls]
Homepage = "https://github.com/SamarjeetMalik/cxr-harmony"
Repository = "https://github.com/SamarjeetMalik/cxr-harmony"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. `typer.Option(...)` in the
# signature is exactly how Typer declares a CLI option, so the rule is
# unavoidable here and is scoped off for this one module rather than disabled
# project-wide.
"src/cxr_harmony/cli.py" = ["B008"]
